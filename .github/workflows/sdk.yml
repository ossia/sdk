name: Build SDK

# The whole SDK in one workflow: the slow-moving CORE (llvm, qt, openssl,
# sysroot) and the fast-moving MEDIA libs (ffmpeg, faust, sdl, fftw) as a
# core-<platform> -> media-<platform> pair per platform, wired with `needs`.
#
# This replaces the core.yml + media.yml pair. `needs` orders the two halves
# inside a run; it does NOT replace the rolling $CORE_RELEASE prerelease, which
# is what shares one core build ACROSS runs -- every later push and every PR
# downloads a core that was built hours earlier by a different run. Both are
# still needed, they just solve different problems.
#
# What the split cost us and this does not:
#   - a workflow_run cascade, which fires on *completed* (not *succeeded*) and
#     needed a conclusion guard plus its own concurrency group to stop a doomed
#     cascade evicting a real run;
#   - two entry points on master (push + cascade) racing in one concurrency
#     group, leaving six cancelled checks on every master commit;
#   - resolve-core.sh's `skip` mode, which existed only to defer to the cascade.
#     media runs after core in the same run, so a matching core always exists by
#     then; every call here passes is_master=false and the mode goes unused (the
#     script keeps it for the manual build.yml escape hatch);
#   - building the core TWICE on a pull request. A PR cannot publish a release,
#     so core.yml built the core and media.yml then rebuilt it inline (measured
#     on PR #19: 53min + a 304min core+media build on linux-x86_64). The core
#     job now hands its tarball to the media job as a run-scoped artifact.
#
# Core reuse is unchanged: a leg whose core hash is already published on
# $CORE_RELEASE short-circuits in seconds and media pulls that asset.

on:
  push:
    branches: [ master ]
    tags: [ 'sdk*' ]        # a tag push publishes the full SDK to that release
    paths-ignore: [ '**/*.md' ]
  pull_request:
    paths-ignore: [ '**/*.md' ]
  workflow_dispatch:
    inputs:
      force_core_rebuild:
        description: "Rebuild the core even if this exact hash is already published"
        type: boolean
        default: false

concurrency:
  group: sdk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write   # publish core prereleases + the full SDK to a release

env:
  # The single rolling prerelease holding the current master core.
  CORE_RELEASE: continuous
  # Where THIS run publishes the full SDK: an sdkNN tag push -> that tag's
  # release; anything else (master push / dispatch) -> continuous.
  SDK_RELEASE: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'continuous' }}
  SDK_ROLLING: ${{ !startsWith(github.ref, 'refs/tags/') }}
  # As before, everything but a PR refreshes the rolling core -- except a tag
  # build, which reuses whatever core matches its hash and must not clobber
  # $CORE_RELEASE: tagging an older commit would otherwise replace the rolling
  # core with an older one. (core.yml never ran on tags, so this case is new.)
  PUBLISH_CORE: ${{ github.event_name != 'pull_request' && !startsWith(github.ref, 'refs/tags/') }}
  # The deliverable goes out on everything except PRs.
  PUBLISH_SDK: ${{ github.event_name != 'pull_request' }}
  FORCE_CORE: ${{ inputs.force_core_rebuild || false }}

jobs:
  plan:
    name: plan
    runs-on: ubuntu-24.04
    steps:
      - name: Resolved decisions for this run
        run: |
          {
            echo "| setting | value |"
            echo "|---|---|"
            echo "| event | \`${{ github.event_name }}\` |"
            echo "| ref | \`${{ github.ref }}\` |"
            echo "| publish core to \`$CORE_RELEASE\` | \`$PUBLISH_CORE\` |"
            echo "| publish SDK | \`$PUBLISH_SDK\` |"
            echo "| SDK release | \`$SDK_RELEASE\` (rolling: \`$SDK_ROLLING\`) |"
            echo "| force core rebuild | \`$FORCE_CORE\` |"
          } >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------- linux ----
  core-linux:
    name: core-linux-${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x86_64,  runner: ubuntu-24.04 }
          - { arch: aarch64, runner: ubuntu-24.04-arm }
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - id: corehash
        uses: ./.github/actions/core-hash
        with: { platform: linux, arch: '${{ matrix.arch }}' }

      # Skip the (multi-hour) build if this exact core is already published.
      - id: check
        run: |
          if [ "$FORCE_CORE" != "true" ] \
             && [ "$(bash .github/core-published.sh "$CORE_RELEASE" \
                       "sdk-core-linux-${{ matrix.arch }}.tar.xz" \
                       '${{ steps.corehash.outputs.core_hash }}')" = "true" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Core sdk-core-linux-${{ matrix.arch }} already published; skipping." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Restore ccache
        if: steps.check.outputs.exists != 'true'
        uses: actions/cache/restore@v4
        with:
          path: ${{ github.workspace }}/.ccache
          key: ccache-core-linux-${{ matrix.arch }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: ccache-core-linux-${{ matrix.arch }}-

      - name: Prepare install prefix
        if: steps.check.outputs.exists != 'true'
        run: |
          sudo mkdir -p /opt/ossia-sdk-${{ matrix.arch }}
          sudo chmod 0777 /opt/ossia-sdk-${{ matrix.arch }}

      - name: Build core (Docker)
        if: steps.check.outputs.exists != 'true'
        working-directory: Linux
        env:
          STAGE: core
          CPU_ARCH: ${{ matrix.arch }}
          CCACHE_DIR: ${{ github.workspace }}/.ccache
        run: ./create-sdk.sh

      - name: Publish core release
        if: steps.check.outputs.exists != 'true' && env.PUBLISH_CORE == 'true'
        env:
          CORE_HASH: ${{ steps.corehash.outputs.core_hash }}
        run: |
          bash .github/publish-core.sh "$CORE_RELEASE" \
            "Linux/sdk-core-linux-${{ matrix.arch }}.tar.xz" "$CORE_HASH"

      # Hand the freshly built core to media-linux in THIS run. Uploaded only
      # when the core was actually rebuilt; when it was already published the
      # media job pulls the release asset instead.
      - name: Hand core to media
        if: steps.check.outputs.exists != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: core-linux-${{ matrix.arch }}
          path: Linux/sdk-core-linux-${{ matrix.arch }}.tar.xz
          retention-days: 1
          if-no-files-found: error

      - name: Save ccache
        if: always() && steps.check.outputs.exists != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ github.workspace }}/.ccache
          key: ccache-core-linux-${{ matrix.arch }}-${{ github.run_id }}-${{ github.run_attempt }}

  media-linux:
    name: media-linux-${{ matrix.arch }}
    needs: core-linux
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x86_64,  runner: ubuntu-24.04 }
          - { arch: aarch64, runner: ubuntu-24.04-arm }
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - id: corehash
        uses: ./.github/actions/core-hash
        with: { platform: linux, arch: '${{ matrix.arch }}' }

      # Present only when core-linux rebuilt; absent when it short-circuited. Hence
      # `pattern` rather than `name`: a missing `name` fails the step, and it is
      # legitimately missing here. continue-on-error too, belt and braces.
      - name: Core handed over by core-linux
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          pattern: core-linux-${{ matrix.arch }}
          merge-multiple: true
          path: core-dl

      - id: resolve
        run: |
          if [ -f "core-dl/sdk-core-linux-${{ matrix.arch }}.tar.xz" ]; then
            echo ">> core handed over by core-linux-${{ matrix.arch }} in this run"
            echo "mode=download" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # is_master=false on purpose: `skip` means "defer to the cascade", and
          # there is no cascade any more. If the published core is somehow gone
          # or stale, rebuild it inline rather than silently produce nothing.
          bash .github/resolve-core.sh \
            "$CORE_RELEASE" \
            "sdk-core-linux-${{ matrix.arch }}.tar.xz" \
            "core-dl" "false" \
            "${{ steps.corehash.outputs.core_hash }}"

      - name: Prepare install prefix
        run: |
          sudo mkdir -p /opt/ossia-sdk-${{ matrix.arch }}
          sudo chmod 0777 /opt/ossia-sdk-${{ matrix.arch }}

      - name: Extract core into prefix
        if: steps.resolve.outputs.mode == 'download'
        run: tar xaf core-dl/sdk-core-linux-${{ matrix.arch }}.tar.xz -C /

      - name: Restore ccache
        uses: actions/cache/restore@v4
        with:
          path: ${{ github.workspace }}/.ccache
          key: ccache-media-linux-${{ matrix.arch }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: ccache-media-linux-${{ matrix.arch }}-

      - name: Guard core (snapshot)
        if: steps.resolve.outputs.mode == 'download'
        run: bash .github/sysroot-guard.sh /opt/ossia-sdk-${{ matrix.arch }}/sysroot "$RUNNER_TEMP/sysroot.snap" snapshot

      - name: Build (Docker)
        working-directory: Linux
        env:
          STAGE: ${{ steps.resolve.outputs.mode == 'inline' && 'full' || 'media' }}
          CPU_ARCH: ${{ matrix.arch }}
          CCACHE_DIR: ${{ github.workspace }}/.ccache
        run: ./create-sdk.sh

      - name: Guard core (verify)
        if: steps.resolve.outputs.mode == 'download'
        run: bash .github/sysroot-guard.sh /opt/ossia-sdk-${{ matrix.arch }}/sysroot "$RUNNER_TEMP/sysroot.snap" verify

      - uses: actions/upload-artifact@v4
        with:
          name: sdk-linux-${{ matrix.arch }}
          path: Linux/sdk-linux-${{ matrix.arch }}.tar.xz
          if-no-files-found: error

      - name: Publish full SDK to release
        if: env.PUBLISH_SDK == 'true'
        run: |
          bash .github/publish-sdk.sh "$SDK_RELEASE" \
            "Linux/sdk-linux-${{ matrix.arch }}.tar.xz" "$SDK_ROLLING"

      - name: Save ccache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ${{ github.workspace }}/.ccache
          key: ccache-media-linux-${{ matrix.arch }}-${{ github.run_id }}-${{ github.run_attempt }}

  # ---------------------------------------------------------------- macos ----
  core-macos:
    name: core-macos-${{ matrix.arch }}
    runs-on: macos-15
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: arm64,  prefix_arch: aarch64 }
          - { arch: x86_64, prefix_arch: x86_64 }
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - id: corehash
        uses: ./.github/actions/core-hash
        with: { platform: macos, arch: '${{ matrix.arch }}' }

      - id: check
        run: |
          if [ "$FORCE_CORE" != "true" ] \
             && [ "$(bash .github/core-published.sh "$CORE_RELEASE" \
                       "sdk-core-macOS-${{ matrix.arch }}.tar.xz" \
                       '${{ steps.corehash.outputs.core_hash }}')" = "true" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Restore ccache
        if: steps.check.outputs.exists != 'true'
        uses: actions/cache/restore@v4
        with:
          path: ${{ github.workspace }}/.ccache
          key: ccache-core-macos-${{ matrix.arch }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: ccache-core-macos-${{ matrix.arch }}-

      - name: Prepare install prefix
        if: steps.check.outputs.exists != 'true'
        run: |
          sudo mkdir -p /opt/ossia-sdk-${{ matrix.prefix_arch }}
          sudo chown "$(whoami)" /opt/ossia-sdk-${{ matrix.prefix_arch }}

      - name: Build core
        if: steps.check.outputs.exists != 'true'
        working-directory: macOS
        env:
          STAGE: core
          TARGET_ARCH: ${{ matrix.arch }}
          CCACHE_DIR: ${{ github.workspace }}/.ccache
          CCACHE_COMPILERCHECK: content
          CCACHE_MAXSIZE: 3G
          CMAKE_C_COMPILER_LAUNCHER: ccache
          CMAKE_CXX_COMPILER_LAUNCHER: ccache
        run: |
          ./deps.sh
          source ./common.sh
          ./all.sh

      - name: Publish core release
        if: steps.check.outputs.exists != 'true' && env.PUBLISH_CORE == 'true'
        env:
          CORE_HASH: ${{ steps.corehash.outputs.core_hash }}
        run: |
          bash .github/publish-core.sh "$CORE_RELEASE" \
            "macOS/sdk-core-macOS-${{ matrix.arch }}.tar.xz" "$CORE_HASH"

      - name: Hand core to media
        if: steps.check.outputs.exists != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: core-macos-${{ matrix.arch }}
          path: macOS/sdk-core-macOS-${{ matrix.arch }}.tar.xz
          retention-days: 1
          if-no-files-found: error

      - name: Save ccache
        if: always() && steps.check.outputs.exists != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ github.workspace }}/.ccache
          key: ccache-core-macos-${{ matrix.arch }}-${{ github.run_id }}-${{ github.run_attempt }}

  media-macos:
    name: media-macos-${{ matrix.arch }}
    needs: core-macos
    runs-on: macos-15
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: arm64,  prefix_arch: aarch64 }
          - { arch: x86_64, prefix_arch: x86_64 }
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - id: corehash
        uses: ./.github/actions/core-hash
        with: { platform: macos, arch: '${{ matrix.arch }}' }

      # Present only when core-macos rebuilt; absent when it short-circuited. Hence
      # `pattern` rather than `name`: a missing `name` fails the step, and it is
      # legitimately missing here. continue-on-error too, belt and braces.
      - name: Core handed over by core-macos
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          pattern: core-macos-${{ matrix.arch }}
          merge-multiple: true
          path: core-dl

      - id: resolve
        run: |
          if [ -f "core-dl/sdk-core-macOS-${{ matrix.arch }}.tar.xz" ]; then
            echo ">> core handed over by core-macos-${{ matrix.arch }} in this run"
            echo "mode=download" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          bash .github/resolve-core.sh \
            "$CORE_RELEASE" \
            "sdk-core-macOS-${{ matrix.arch }}.tar.xz" \
            "core-dl" "false" \
            "${{ steps.corehash.outputs.core_hash }}"

      - name: Prepare install prefix
        run: |
          sudo mkdir -p /opt/ossia-sdk-${{ matrix.prefix_arch }}
          sudo chown "$(whoami)" /opt/ossia-sdk-${{ matrix.prefix_arch }}

      - name: Extract core into prefix
        if: steps.resolve.outputs.mode == 'download'
        run: tar xaf core-dl/sdk-core-macOS-${{ matrix.arch }}.tar.xz -C /

      - name: Restore ccache
        uses: actions/cache/restore@v4
        with:
          path: ${{ github.workspace }}/.ccache
          key: ccache-media-macos-${{ matrix.arch }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: ccache-media-macos-${{ matrix.arch }}-

      - name: Guard core (snapshot)
        if: steps.resolve.outputs.mode == 'download'
        run: bash .github/sysroot-guard.sh /opt/ossia-sdk-${{ matrix.prefix_arch }}/freetype "$RUNNER_TEMP/core.snap" snapshot

      - name: Build
        working-directory: macOS
        env:
          STAGE: ${{ steps.resolve.outputs.mode == 'inline' && 'full' || 'media' }}
          TARGET_ARCH: ${{ matrix.arch }}
          CCACHE_DIR: ${{ github.workspace }}/.ccache
          CCACHE_COMPILERCHECK: content
          CCACHE_MAXSIZE: 3G
          CMAKE_C_COMPILER_LAUNCHER: ccache
          CMAKE_CXX_COMPILER_LAUNCHER: ccache
        run: |
          ./deps.sh
          source ./common.sh
          ./all.sh

      - name: Guard core (verify)
        if: steps.resolve.outputs.mode == 'download'
        run: bash .github/sysroot-guard.sh /opt/ossia-sdk-${{ matrix.prefix_arch }}/freetype "$RUNNER_TEMP/core.snap" verify

      - uses: actions/upload-artifact@v4
        with:
          name: sdk-macos-${{ matrix.arch }}
          path: macOS/sdk-macOS-${{ matrix.arch }}.tar.xz
          if-no-files-found: error

      - name: Publish full SDK to release
        if: env.PUBLISH_SDK == 'true'
        run: |
          bash .github/publish-sdk.sh "$SDK_RELEASE" \
            "macOS/sdk-macOS-${{ matrix.arch }}.tar.xz" "$SDK_ROLLING"

      - name: Save ccache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ${{ github.workspace }}/.ccache
          key: ccache-media-macos-${{ matrix.arch }}-${{ github.run_id }}-${{ github.run_attempt }}

  # -------------------------------------------------------------- windows ----
  core-windows:
    name: core-windows-${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 360
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x86_64, runner: windows-2022,    msystem: CLANG64,    sdk_arch: x86_64 }
          - { arch: arm64,  runner: windows-11-arm,  msystem: CLANGARM64, sdk_arch: aarch64 }
    defaults:
      run:
        shell: msys2 {0}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      # corehash + check run in Git bash (no msys2 needed), so they gate the
      # ~3min msys2 setup: a no-op leg (core already published) skips it entirely.
      - id: corehash
        uses: ./.github/actions/core-hash
        with: { platform: windows, arch: '${{ matrix.arch }}' }

      - id: check
        shell: bash   # Git bash: has gh on PATH (msys2 minimal PATH does not)
        run: |
          if [ "$FORCE_CORE" != "true" ] \
             && [ "$(bash .github/core-published.sh "$CORE_RELEASE" \
                       "sdk-core-mingw-${{ matrix.sdk_arch }}.7z" \
                       '${{ steps.corehash.outputs.core_hash }}')" = "true" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: msys2/setup-msys2@v2
        if: steps.check.outputs.exists != 'true'
        with:
          msystem: ${{ matrix.msystem }}
          update: true
          install: git wget tar unzip diffutils yasm

      - name: Build core
        if: steps.check.outputs.exists != 'true'
        working-directory: MSYS
        env:
          STAGE: core
          TARGET_ARCH: ${{ matrix.arch }}
          CCACHE_COMPILERCHECK: content
          CCACHE_MAXSIZE: 2G
          CMAKE_C_COMPILER_LAUNCHER: ccache
          CMAKE_CXX_COMPILER_LAUNCHER: ccache
        run: |
          export CCACHE_DIR="$(cygpath -u "$GITHUB_WORKSPACE")/.ccache"
          ./deps.sh
          ./all.sh

      - name: Publish core release
        if: steps.check.outputs.exists != 'true' && env.PUBLISH_CORE == 'true'
        shell: bash   # Git bash: has gh on PATH
        env:
          CORE_HASH: ${{ steps.corehash.outputs.core_hash }}
        run: |
          file=$(ls MSYS/sdk-core-mingw-*.7z | head -1)
          bash .github/publish-core.sh "$CORE_RELEASE" "$file" "$CORE_HASH"

      - name: Hand core to media
        if: steps.check.outputs.exists != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: core-windows-${{ matrix.arch }}
          path: MSYS/sdk-core-mingw-*.7z   # glob, as the publish step does
          retention-days: 1
          if-no-files-found: error

  media-windows:
    name: media-windows-${{ matrix.arch }}
    needs: core-windows
    # core-windows is continue-on-error, so it must not gate media the way a
    # failed linux/macos core does. Run unless the whole run was cancelled; a
    # windows core failure then falls back to the published core.
    if: ${{ !cancelled() }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 360
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x86_64, runner: windows-2022,   msystem: CLANG64,    sdk_arch: x86_64 }
          - { arch: arm64,  runner: windows-11-arm, msystem: CLANGARM64, sdk_arch: aarch64 }
    defaults:
      run:
        shell: msys2 {0}   # build/extract/guard steps run in msys2; gh steps override to bash
    env:
      GH_TOKEN: ${{ github.token }}
      # Job-level so the Extract/Guard steps compute the SAME INSTALL_PREFIX as
      # the Build step. Without it common.sh defaults SDK_ARCH to x86_64, so on
      # arm64 the core extracted into /c/ossia-sdk-x86_64 and the build (looking
      # in /c/ossia-sdk-aarch64) failed to find it (e.g. 'libsnappy not found').
      TARGET_ARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@v4

      - id: corehash
        uses: ./.github/actions/core-hash
        with: { platform: windows, arch: '${{ matrix.arch }}' }

      # Present only when core-windows rebuilt; absent when it short-circuited. Hence
      # `pattern` rather than `name`: a missing `name` fails the step, and it is
      # legitimately missing here. continue-on-error too, belt and braces.
      - name: Core handed over by core-windows
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          pattern: core-windows-${{ matrix.arch }}
          merge-multiple: true
          path: core-dl

      - id: resolve
        shell: bash   # Git bash: has gh on PATH
        run: |
          if ls core-dl/sdk-core-mingw-*.7z >/dev/null 2>&1; then
            echo ">> core handed over by core-windows-${{ matrix.arch }} in this run"
            echo "mode=download" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          bash .github/resolve-core.sh \
            "$CORE_RELEASE" \
            "sdk-core-mingw-${{ matrix.sdk_arch }}.7z" \
            "core-dl" "false" \
            "${{ steps.corehash.outputs.core_hash }}"

      - uses: msys2/setup-msys2@v2
        with:
          msystem: ${{ matrix.msystem }}
          update: true
          # The core .7z is produced by MSYS/all.sh with the mingw 7-Zip, which
          # uses a compression method the old msys p7zip (7za) cannot decode
          # ("Unsupported Method"). Install the SAME mingw 7zip here so `7z` can
          # extract it, BEFORE the build step's MSYS/deps.sh installs it later.
          install: git wget tar unzip diffutils yasm mingw-w64-clang-${{ matrix.sdk_arch }}-7zip

      - name: Extract core into prefix
        if: steps.resolve.outputs.mode == 'download'
        working-directory: MSYS
        run: |
          source ./common.sh
          mkdir -p "$INSTALL_PREFIX"
          dl="$(cygpath -u "$GITHUB_WORKSPACE")/core-dl"
          7z x "$dl"/sdk-core-mingw-*.7z -o"$INSTALL_PREFIX" -y

      - name: Guard core (snapshot)
        if: steps.resolve.outputs.mode == 'download'
        working-directory: MSYS
        run: |
          source ./common.sh
          bash "$(cygpath -u "$GITHUB_WORKSPACE")/.github/sysroot-guard.sh" "$INSTALL_PREFIX/sysroot" "$RUNNER_TEMP/sysroot.snap" snapshot

      - name: Build
        working-directory: MSYS
        env:
          STAGE: ${{ steps.resolve.outputs.mode == 'inline' && 'full' || 'media' }}
          TARGET_ARCH: ${{ matrix.arch }}
          CCACHE_COMPILERCHECK: content
          CCACHE_MAXSIZE: 2G
          CMAKE_C_COMPILER_LAUNCHER: ccache
          CMAKE_CXX_COMPILER_LAUNCHER: ccache
        run: |
          export CCACHE_DIR="$(cygpath -u "$GITHUB_WORKSPACE")/.ccache"
          ./deps.sh
          ./all.sh

      - name: Guard core (verify)
        if: steps.resolve.outputs.mode == 'download'
        working-directory: MSYS
        run: |
          source ./common.sh
          bash "$(cygpath -u "$GITHUB_WORKSPACE")/.github/sysroot-guard.sh" "$INSTALL_PREFIX/sysroot" "$RUNNER_TEMP/sysroot.snap" verify

      - uses: actions/upload-artifact@v4
        with:
          name: sdk-windows-${{ matrix.arch }}
          path: MSYS/sdk-mingw-*.7z
          if-no-files-found: warn

      - name: Publish full SDK to release
        if: env.PUBLISH_SDK == 'true'
        shell: bash   # Git bash: has gh on PATH
        run: |
          file=$(ls MSYS/sdk-mingw-*.7z | head -1)
          bash .github/publish-sdk.sh "$SDK_RELEASE" "$file" "$SDK_ROLLING"
